<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTR</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0072CE">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-blue: #0072CE;
      --primary-green: #2ECC71;
    }
    .bg-maxtec-blue { background-color: #0072CE; }
    .text-maxtec-blue { color: #0072CE; }
    .bg-maxtec-green { background-color: #2ECC71; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- HEADER CORPORATIVO -->
  <header class="bg-maxtec-blue text-white shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-white/10 p-2 rounded-lg">
          <i class="fa-solid fa-truck-fast text-xl text-[#2ECC71]"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg tracking-wide">LOGÍSTICA CTR</h1>
          <p class="text-xs text-blue-100">Maxtec • Operação de Campo</p>
        </div>
      </div>
      <div id="user-info" class="hidden items-center space-x-3 text-sm">
        <span id="nav-username" class="font-medium bg-white/10 px-3 py-1 rounded-full"></span>
        <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-xs font-semibold transition">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> Sair
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4">

    <!-- TELA DE LOGIN SIMPLIFICADA -->
    <section id="screen-login" class="max-w-md mx-auto mt-10 bg-white p-8 rounded-2xl shadow-lg border-t-4 border-[#2ECC71]">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-50 text-maxtec-blue rounded-full mb-3 text-2xl shadow-inner">
          <i class="fa-solid fa-user-check"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-900">Acesso ao Sistema</h2>
        <p class="text-sm text-gray-500 mt-1">Digite seu nome para acessar a operação</p>
      </div>

      <form id="form-login" onsubmit="fazerLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-gray-600 mb-1">URL do Apps Script (Web App):</label>
          <input type="url" id="script-url" required placeholder="https://script.google.com/macros/s/.../exec" 
                 class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#0072CE] focus:outline-none text-sm bg-gray-50">
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Seu Nome / Identificação:</label>
          <input type="text" id="login-nome" required placeholder="Ex: Thiago ou Admin" 
                 class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#0072CE] focus:outline-none text-sm">
        </div>

        <button type="submit" id="btn-login" class="w-full bg-maxtec-blue hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition flex items-center justify-center space-x-2">
          <span>Entrar no Sistema</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>
    </section>

    <!-- TELA DO PAINEL -->
    <section id="screen-dashboard" class="hidden space-y-6">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex justify-between items-center">
        <div class="flex items-center space-x-2">
          <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
          <span class="text-sm font-medium text-gray-700">Online • Sincronizado</span>
        </div>
        <button onclick="carregarAtividades()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold transition">
          <i class="fa-solid fa-rotate mr-1"></i> Atualizar
        </button>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex justify-between items-center">
          <h3 class="font-bold text-gray-800 flex items-center space-x-2">
            <i class="fa-solid fa-route text-maxtec-blue"></i>
            <span>Atividades e Demandas do Dia</span>
          </h3>
          <span id="badge-total-atividades" class="bg-blue-100 text-maxtec-blue text-xs font-bold px-2.5 py-1 rounded-full">0 atividades</span>
        </div>
        <div id="lista-atividades" class="divide-y divide-gray-200">
          <div class="p-8 text-center text-gray-400">Carregando atividades...</div>
        </div>
      </div>
    </section>

    <!-- MODAL DE ATUALIZAÇÃO -->
    <div id="modal-atividade" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
        <button onclick="fecharModal()" class="absolute top-4 right-4 text-gray-400 font-bold text-xl"><i class="fa-solid fa-xmark"></i></button>
        <h3 id="modal-cliente-titulo" class="text-xl font-bold text-gray-900 mb-1">Atualizar Atividade</h3>
        <p id="modal-mtr-sub" class="text-xs text-gray-500 mb-4 font-mono"></p>

        <form onsubmit="salvarAtividade(event)" class="space-y-4">
          <input type="hidden" id="modal-atv-id">
          <div>
            <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Status:</label>
            <select id="modal-status" class="w-full px-3 py-2 rounded-lg border text-sm bg-white">
              <option value="Pendente">Pendente</option>
              <option value="Em andamento">Em andamento</option>
              <option value="Realizada">Realizada</option>
              <option value="Não realizada">Não realizada</option>
              <option value="Reprogramada">Reprogramada</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Peso Coletado (kg):</label>
            <input type="number" step="0.01" id="modal-peso" placeholder="0.00" class="w-full px-3 py-2 rounded-lg border text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Ocorrência / Observações:</label>
            <textarea id="modal-ocorrencia" rows="3" class="w-full px-3 py-2 rounded-lg border text-sm" placeholder="Observações de campo..."></textarea>
          </div>
          <div class="flex space-x-3 pt-2">
            <button type="button" onclick="fecharModal()" class="flex-1 bg-gray-200 py-2 rounded-lg text-sm font-bold">Cancelar</button>
            <button type="submit" class="flex-1 bg-maxtec-green text-white py-2 rounded-lg text-sm font-bold shadow">Salvar</button>
          </div>
        </form>
      </div>
    </div>

  </main>

  <script>
    let currentUser = null;
    let appScriptUrl = localStorage.getItem('maxtec_script_url') || '';
    let atividadesCache = [];

    if (appScriptUrl) document.getElementById('script-url').value = appScriptUrl;

    const savedUser = localStorage.getItem('maxtec_current_user');
    if (savedUser) {
      currentUser = JSON.parse(savedUser);
      mostrarDashboard();
    }

    function fazerLogin(e) {
      e.preventDefault();
      const url = document.getElementById('script-url').value.trim();
      const nome = document.getElementById('login-nome').value.trim();

      localStorage.setItem('maxtec_script_url', url);
      appScriptUrl = url;

      const btn = document.getElementById('btn-login');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Entrando...';
      btn.disabled = true;

      fetch(`${url}?action=login&nome=${encodeURIComponent(nome)}`)
        .then(res => res.json())
        .then(data => {
          if (data.status === 'success') {
            currentUser = data.usuario;
            localStorage.setItem('maxtec_current_user', JSON.stringify(currentUser));
            mostrarDashboard();
          } else {
            alert('Erro: ' + data.message);
          }
        })
        .catch(err => alert('Erro de conexão com o Apps Script.'))
        .finally(() => {
          btn.innerHTML = '<span>Entrar no Sistema</span><i class="fa-solid fa-arrow-right"></i>';
          btn.disabled = false;
        });
    }

    function logout() {
      localStorage.removeItem('maxtec_current_user');
      location.reload();
    }

    function mostrarDashboard() {
      document.getElementById('screen-login').classList.add('hidden');
      document.getElementById('screen-dashboard').classList.remove('hidden');
      document.getElementById('user-info').classList.remove('hidden');
      document.getElementById('nav-username').textContent = currentUser.nome;
      carregarAtividades();
    }

    function carregarAtividades() {
      fetch(`${appScriptUrl}?action=getAtividades`)
        .then(res => res.json())
        .then(data => {
          if (data.status === 'success') {
            atividadesCache = data.atividades || [];
            renderizarAtividades(atividadesCache);
          }
        });
    }

    function renderizarAtividades(atividades) {
      const listaDiv = document.getElementById('lista-atividades');
      document.getElementById('badge-total-atividades').textContent = `${atividades.length} atividades`;

      if (atividades.length === 0) {
        listaDiv.innerHTML = '<div class="p-8 text-center text-gray-400">Nenhuma atividade cadastrada na planilha.</div>';
        return;
      }

      let html = '';
      atividades.forEach(atv => {
        html += `
          <div class="p-4 sm:p-6 flex justify-between items-center gap-4">
            <div>
              <span class="text-xs font-mono font-bold bg-gray-100 px-2 py-0.5 rounded">MTR: ${atv.mtr || 'N/A'}</span>
              <h4 class="text-base font-bold text-gray-900 mt-1">${atv.cliente}</h4>
              <p class="text-xs text-gray-500">Destino: ${atv.destino} | Status: ${atv.status}</p>
            </div>
            <button onclick="abrirModal('${atv.id}')" class="bg-maxtec-blue text-white px-4 py-2 rounded-lg text-xs font-bold">
              Atualizar
            </button>
          </div>
        `;
      });
      listaDiv.innerHTML = html;
    }

    function abrirModal(id) {
      const atv = atividadesCache.find(a => a.id.toString() === id.toString());
      if (!atv) return;
      document.getElementById('modal-atv-id').value = atv.id;
      document.getElementById('modal-cliente-titulo').textContent = atv.cliente;
      document.getElementById('modal-mtr-sub').textContent = `MTR: ${atv.mtr || 'N/A'}`;
      document.getElementById('modal-status').value = atv.status || 'Pendente';
      document.getElementById('modal-peso').value = atv.peso_kg || '';
      document.getElementById('modal-ocorrencia').value = atv.ocorrencia || '';
      document.getElementById('modal-atividade').classList.remove('hidden');
    }

    function fecharModal() {
      document.getElementById('modal-atividade').classList.add('hidden');
    }

    function salvarAtividade(e) {
      e.preventDefault();
      const payload = {
        action: 'atualizarAtividade',
        id: document.getElementById('modal-atv-id').value,
        status: document.getElementById('modal-status').value,
        peso_kg: document.getElementById('modal-peso').value,
        ocorrencia: document.getElementById('modal-ocorrencia').value
      };

      fetch(appScriptUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          alert('Atualizado com sucesso!');
          fecharModal();
          carregarAtividades();
        }
      });
    }
  </script>
</body>
</html>
